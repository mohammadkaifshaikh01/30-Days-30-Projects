<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Todo App</title>
   <style>
      body {
         display: flex;
         justify-content: center;
         align-items: center;
         flex-direction: column;
         height: 100vh;
      }

      .container {
         width: 400px;
         background-color: black;
         color: white;
         height: 50vh;
         display: flex;
         flex-direction: column;
         justify-content: center;
         align-items: center;
         padding: 20px;
         border-radius: 10px;
      }

      .input-container {
         display: flex;
         /* width: 100%; */
         align-items: center;
      }

      input[type="text"] {
         width: 70%;
         padding: 8px;
         font-size: 1rem;
         border: 2px solid white;
         border-radius: 5px;
         margin-bottom: 10px;
         outline: none;
         background-color: transparent;
         color: white;
      }

      input[type="text"]::placeholder {
         color: #bbb;
      }

      button {
         padding: 8px 15px;
         background-color: #28a745;
         color: white;
         border: none;
         width: 10rem;
         margin: 0;
         border-radius: 5px;
         cursor: pointer;
         font-size: 0.8rem;
         height: 40px;
         transition: background-color 0.3s ease;
      }

      button:hover {
         background-color: #218838;
      }

      .display {
         width: 90%;
         height: 100%;
         overflow-y: auto;
         background-color: #222;
         padding: 10px;
         border-radius: 5px;
         box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
      }
   </style>

   <div class="container">
      <div class="input-container">
         <input type="text" placeholder="Write Your Task" id="write">
         <button id="btn" onclick="add()">Add Task</button>
      </div>
      <div class="display">

      </div>

   </div>
</head>

<body>

</body>
<script>
   const search = document.getElementById("write")
   const display = document.querySelector(".display")
   function add() {
      if (search.value == "") {
         alert("Task Should Not Be Empty")
      } else {
         let newElement = document.createElement("li")
         newElement.innerHTML = search.value
         display.appendChild(newElement)
         search.value = ""

      }
   }


</script>

</html>

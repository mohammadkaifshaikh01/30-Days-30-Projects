<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Drum Kit</title>
   <style>
      body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(to bottom, #141e30, #243b55);
    color: white;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.title h3 {
    font-size: 2rem;
    font-weight: bold;
    letter-spacing: 2px;
    color: #ffcf33;
    text-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
    margin-bottom: 20px;
}

.drum-kit {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    width: 90%;
    max-width: 800px;
}

.key {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px 20px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    font-size: 1.2rem;
    font-weight: bold;
    background: linear-gradient(145deg, #2b2b2b, #3f3f3f);
    box-shadow: 5px 5px 10px #1a1a1a, -5px -5px 10px #505050;
    color: white;
    cursor: pointer;
    transition: transform 0.1s ease, background-color 0.3s;
}

.key span {
    margin-top: 10px;
    font-size: 0.9rem;
    color: #ffcf33;
}

.key.playing {
    transform: scale(1.2);
    background: linear-gradient(145deg, #ff6600, #ff9900);
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.2);
    color: white;
    border: 2px solid #fff;
}

.key:hover {
    background: linear-gradient(145deg, #454545, #5e5e5e);
    color: #ffcf33;
    box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.5), -5px -5px 15px rgba(255, 255, 255, 0.1);
}

kbd {
    font-size: 1.5rem;
    font-weight: bold;
    background-color: #222;
    color: #ffcf33;
    padding: 10px 15px;
    border-radius: 5px;
    text-shadow: 0 2px 3px rgba(0, 0, 0, 0.5);
}

   </style>
</head>
<body>
   <div class="title">
      <h3>Javascript Drum Kit</h3>
   </div>

   <div class="drum-kit">
      <div class="key" data-key="65">
         <kbd>A</kbd>
         <span class="sound">Clap</span>
      </div>
      <div class="key" data-key="83">
         <kbd>S</kbd>
         <span class="sound">Hi-Hat</span>
      </div>
      <div class="key" data-key="68">
         <kbd>D</kbd>
         <span class="sound">Kick</span>
      </div>
      <div class="key" data-key="70">
         <kbd>F</kbd>
         <span class="sound">Openhat</span>
      </div>
      <div class="key" data-key="71">
         <kbd>G</kbd>
         <span class="sound">Crash</span>
      </div>
      <div class="key" data-key="72">
         <kbd>H</kbd>
         <span class="sound">Ride</span>
      </div>
      <div class="key" data-key="74">
         <kbd>J</kbd>
         <span class="sound">Snare</span>
      </div>
      <div class="key" data-key="75">
         <kbd>K</kbd>
         <span class="sound">Tom</span>
      </div>
      <div class="key" data-key="76">
         <kbd>L</kbd>
         <span class="sound">Orchestra</span>
      </div>
   </div>

   <audio data-key="65" src="./boom-2e-crash-237002.mp3"></audio>
   <audio data-key="83" src="./electronic-ride-4-47405.mp3"></audio>
   <audio data-key="68" src="./electronic-ride-4-47405.mp3"></audio>
   <audio data-key="70" src="./new-kick-01-238978.mp3"></audio>
   <audio data-key="71" src="./openhat-164697.mp3"></audio>
   <audio data-key="72" src="./orchestra-hit-240475.mp3"></audio>
   <audio data-key="74" src="./tom-2-85124.mp3"></audio>
   <audio data-key="75" src="./tr808-clap-241405.mp3"></audio>
   <audio data-key="76" src="./tr808-snare-drum-241403.mp3"></audio>

   <script>
      window.addEventListener('keydown', function(event) {
         const audio = document.querySelector(`audio[data-key="${event.keyCode}"]`);
         const key = document.querySelector(`.key[data-key="${event.keyCode}"]`);
         if (!audio) return;
         audio.currentTime = 0; 
         audio.play();
         key.classList.add('playing'); 
      });

      const keys = document.querySelectorAll('.key');
      keys.forEach(key => {
         key.addEventListener('transitionend', function(event) {
            if (event.propertyName !== 'transform') return; 
            this.classList.remove('playing'); 
         });
      });
   </script>
</body>
</html>
